x-producer-env: &producer_env
  SERVER_URL: "${SERVER_URL}"
  COMMANDS_DIR: "${COMMANDS_DIR:-/commands}"
  VIDEO_DIR: "${VIDEO_DIR:-/video}"
  VIDEO_DEVICE: "${VIDEO_DEVICE:-/dev/video0}"
  WIDTH: "${WIDTH:-480}"
  HEIGHT: "${HEIGHT:-480}"
  QUALITY: "${QUALITY:-90}"
  RECORD_FPS: "${RECORD_FPS:-30}"
  MAV_BAUD: "${MAV_BAUD:-57600}"
  TELEM_TIMEOUT: "${TELEM_TIMEOUT:-2.0}"
  MOVE_METHOD: "${MOVE_METHOD:-0}"
  EXECUTE_MOVES: "${EXECUTE_MOVES:-1}"

x-producer-vols: &producer_vols
  - ../:/app
  - ../commands:/commands
  - ../video:/video
  - /run/udev:/run/udev:ro
  - /dev:/dev
  - /sys:/sys

x-producer-common: &producer_common
  image: flysearch:latest
  build: 
    context: ..
    dockerfile: Dockerfile
  command: >
    python3 -m drone_control.main
    --server ${SERVER_URL}
  working_dir: /app
  volumes: *producer_vols
  environment: *producer_env
  tty: true 
  stdin_open: true

services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu121}"
    image: flysearch:latest
    command: python3 -u -m mission_control.main
    working_dir: /app
    volumes:
      - ../:/app
      - ../uploads:/uploads
      - ../recordings:/recordings
    environment:
        PYTHONUNBUFFERED: "1"
        WS_HOST: "${WS_HOST:-0.0.0.0}"
        WS_PORT: "${WS_PORT:-8080}"
        UPLOAD_DIR: "${UPLOAD_DIR:-/app/uploads}"
        MAX_WS_MB: "${MAX_WS_MB:-25}"
        WS_PING_INTERVAL: "${WS_PING_INTERVAL:-20}"
        WS_PING_TIMEOUT: "${WS_PING_TIMEOUT:-none}"
        FOV_ANGLE: "${FOV_ANGLE:-90}"
        OPEN_AI_KEY: "${OPEN_AI_KEY}"
        GEMINI_AI_KEY: "${GEMINI_AI_KEY}"
        MODEL_BACKEND: "${MODEL_BACKEND}"
        MODEL_NAME: "${MODEL_NAME}"
        CHATS_DIR: "${CHATS_DIR:-/app/saved_chats}"
        PROMPTS_DIR: "${PROMPTS_DIR:-/app/prompts}"
        TELEMETRY_DIR: "${TELEMETRY_DIR:-/app/telemetry}"
        RECORDINGS_DIR: "${RECORDINGS_DIR:-/recordings}"
        PULL_BATCH_SIZE: "${PULL_BATCH_SIZE:-2}"
        PULL_CHUNK_BYTES: "${PULL_CHUNK_BYTES:-524288}"
        RECORD_FPS: "${RECORD_FPS:-30}"
        # Gaussian-splat renderer
        GS_SPLAT_PATH: "${GS_SPLAT_PATH:-/app/splats/BS.compressed.ply}"
        GS_START_X: "${GS_START_X:-0}"
        GS_START_Y: "${GS_START_Y:-40}"
        GS_START_Z: "${GS_START_Z:-0}"
        GS_METRES_PER_UNIT: "${GS_METRES_PER_UNIT:-1.0}"
        GS_WIDTH: "${GS_WIDTH:-1024}"
        GS_HEIGHT: "${GS_HEIGHT:-1024}"
        GS_FOV: "${GS_FOV:-70}"
        GS_JPEG_QUALITY: "${GS_JPEG_QUALITY:-95}"
        GS_SPLAT_RADIUS: "${GS_SPLAT_RADIUS:-3.0}"
        GS_EWA_MIN: "${GS_EWA_MIN:-0.0}"
        GS_MAX_ANISOTROPY: "${GS_MAX_ANISOTROPY:-10.0}"
        GS_SUPERSAMPLE: "${GS_SUPERSAMPLE:-2}"
        GS_DEVICE: "${GS_DEVICE:-cpu}"
        GS_MAX_SPLATS: "${GS_MAX_SPLATS:-}"
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8000:8000"
    profiles: ["server"]
    
  # drone / RPi hardware for actual workflow — run this on the Raspberry Pi
  producer:
    <<: *producer_common
    profiles: ["producer"]
    environment:
      <<: *producer_env
      MAV_DEVICE: "${MAV_DEVICE:-/dev/ttyAMA0}"

    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 235:* rmw"
      - "c 253:* rmw"

    group_add:
      - video

    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
      - /dev/video0:/dev/video0
    
  # no-drone / laptop-friendly for tests without drone
  producer_test:
    <<: *producer_common
    profiles: ["producer_test"]
    environment:
      <<: *producer_env
      MAV_DEVICE: ""
    privileged: true
    volumes:
      - ../:/app
      - ../commands:/commands
      - ../video:/video
      - /run/udev:/run/udev:ro
      - /dev:/dev
      - /sys:/sys
